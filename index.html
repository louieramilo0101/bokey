<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A bouquet for Danica</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fbf3f6; --bg2:#ece3f6; --bg3:#d9cbee;
  --ink:#4a2d63; --soft:#7b6296; --glow:rgba(255,255,255,.7);
  --paper:#f4ecfa; --paper2:#e4d6f3; --ribbon:#8a5fc0; --ray:rgba(255,255,255,.75); --card:#fffafc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#2a1d3d; --bg2:#231733; --bg3:#1a1026;
    --ink:#eadcf8; --soft:#b9a3d6; --glow:rgba(167,130,214,.25);
    --paper:#5a4378; --paper2:#4a3463; --ribbon:#c5b0ec; --ray:rgba(197,176,236,.28); --card:#3a2a52;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:100vh; overflow-x:hidden; display:flex; flex-direction:column; align-items:center;
  font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif; color:var(--ink);
  background:radial-gradient(60% 45% at 50% 42%, var(--glow), transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-color:var(--bg2);
}
header{text-align:center;padding:36px 20px 0}
h1{font-family:'Great Vibes','Snell Roundhand',cursive;font-weight:400;font-size:clamp(2.9rem,12vw,5.2rem);margin:0;line-height:1.3;padding:.05em .2em .12em;
  background:linear-gradient(100deg,var(--ink) 0%,var(--ink) 35%,#b58be8 50%,var(--ink) 65%,var(--ink) 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--ink);
  animation:write 2.6s cubic-bezier(.5,0,.3,1) .3s both,shine 7s ease-in-out 3s infinite}
@keyframes write{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -5% -20% 0)}}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.sub{margin:4px 0 0;font-size:clamp(1.15rem,3.6vw,1.45rem);color:var(--soft)}
.hint{margin:6px 0 0;font-size:1.05rem;font-style:italic;color:var(--soft);min-height:1.4em}
main{width:100%;max-width:560px;padding:0 12px;position:relative}
.rays,.halo{position:absolute;left:50%;top:32%;translate:-50% -50%;pointer-events:none}
.rays{width:150%;aspect-ratio:1;background:repeating-conic-gradient(var(--ray) 0 5deg,transparent 5deg 16deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 80s linear infinite;transition:opacity 1s}
.halo{width:105%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);animation:pulse 5s ease-in-out infinite}
.all .rays{opacity:1;animation-duration:30s}
@keyframes spin{to{rotate:360deg}}
@keyframes pulse{0%,100%{opacity:.6;scale:.94}50%{opacity:1;scale:1.06}}
svg{width:100%;height:auto;display:block;overflow:visible;position:relative;z-index:1;filter:drop-shadow(0 14px 22px rgba(120,80,170,.22))}
.g{transform-origin:300px 620px;animation:grow 1.5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.12s + .4s)}
@keyframes grow{from{transform:scale(.05);opacity:0}to{transform:none;opacity:1}}
.f{animation:sway 6s ease-in-out infinite;transform-origin:300px 620px}
.f[data-i]{cursor:pointer;outline:none}
.f[data-i]:focus-visible .head{filter:drop-shadow(0 0 6px var(--ribbon))}
.f[data-i]:hover .head{filter:drop-shadow(0 0 8px rgba(190,150,240,.9))}
@keyframes sway{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(1.1deg)}}
.head{transform-box:fill-box;transform-origin:center;animation:bloom 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*.12s + 1.1s)}
@keyframes bloom{from{transform:scale(.25)}to{transform:scale(1)}}
.head.pop{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding:6px 16px 0}
.btn{font:inherit;font-size:1.2rem;color:var(--ink);background:var(--glow);border:1px solid var(--ribbon);border-radius:999px;padding:10px 24px;cursor:pointer;backdrop-filter:blur(6px)}
.btn:focus-visible,#cl:focus-visible{outline:2px solid var(--ribbon);outline-offset:3px}
.btn.main{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(160,120,220,.0)}50%{box-shadow:0 0 22px 4px rgba(160,120,220,.5)}}
footer{text-align:center;padding:18px 20px 36px;color:var(--soft);font-size:1.05rem;font-style:italic}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.sp{position:absolute;width:var(--z);height:var(--z);background:radial-gradient(circle,#fff 0,rgba(255,255,255,.9) 25%,transparent 70%);border-radius:50%;box-shadow:0 0 10px 2px rgba(200,170,245,.7);opacity:0;animation:tw var(--d) ease-in-out infinite;animation-delay:var(--l)}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.95;transform:scale(1)}}
.pt{position:absolute;top:0;width:var(--z);height:calc(var(--z)*1.5);border-radius:100% 0 100% 0;background:var(--c);opacity:.7;animation:fall var(--d) linear infinite;animation-delay:var(--l)}
@keyframes fall{from{transform:translate(0,-12vh) rotate(0)}50%{transform:translate(calc(var(--dx)*.5),55vh) rotate(260deg)}to{transform:translate(var(--dx),112vh) rotate(540deg)}}
.bp{position:absolute;width:10px;height:15px;border-radius:100% 0 100% 0;background:var(--c);animation:bp .95s ease-out forwards}
@keyframes bp{from{transform:translate(0,0) scale(1) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(220deg);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;transition:.4s;z-index:5;max-width:min(90vw,440px);text-align:center;font-size:1.3rem;line-height:1.3;padding:14px 22px;border-radius:18px;background:var(--card);color:var(--ink);box-shadow:0 10px 30px rgba(90,50,140,.3);pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font-size:.95rem;color:var(--soft);margin-top:4px}
.lt{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(40,20,60,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lt[hidden]{display:none}
.paper{position:relative;width:100%;max-width:520px;max-height:82vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:8px;padding:34px 28px 24px;box-shadow:0 20px 60px rgba(40,10,70,.45);transform-origin:50% 100%;animation:unfold .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes unfold{from{transform:translateY(60px) scaleY(.05);opacity:0}to{transform:none;opacity:1}}
#tx{white-space:pre-line;font-size:1.28rem;line-height:1.55;min-height:6em}
#cl{position:absolute;top:6px;right:10px;font:inherit;font-size:2rem;line-height:1;background:none;border:0;color:var(--soft);cursor:pointer;padding:4px 10px}
#sk{display:block;margin:16px auto 0;font:inherit;font-size:1rem;font-style:italic;background:none;border:0;color:var(--soft);cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.g,.f,.head,.rays,.halo,.sp,.pt,h1,.btn.main,.paper{animation:none}.sp{opacity:.6}.pt{display:none}}
</style>
</head>
<body>
<header>
  <h1 id="to">Danica MY LOVES!</h1>
  <p class="sub">Twenty flowers, in every shade of lavender.</p>
  <p class="hint" id="cnt">Tap a flower. 0 of 20 found.</p>
</header>
<main><div class="halo"></div><div class="rays"></div><svg id="b" viewBox="0 0 600 760" role="group" aria-label="A bouquet of twenty purple and lavender flowers tied with a ribbon"></svg></main>
<div class="row">
  <button class="btn main" id="op">Open my letter</button>
  <button class="btn" id="mu" aria-pressed="false">Play music</button>
</div>
<footer></footer>
<div id="toast" role="status" aria-live="polite"></div>
<div class="lt" id="lt" hidden role="dialog" aria-modal="true" aria-label="A letter for Danica">
  <div class="paper" id="pp"><button id="cl" aria-label="Close letter">×</button><div id="tx"></div><button id="sk">Show all</button></div>
</div>
<script>
const P=['#c5b0ec','#b79ae0','#d3bff2','#a782d6','#8f63c4','#e0d1f6','#9a74cf'];
const L=['#e8dcf8','#d9c6f0','#f1e8fb','#c9b0e8','#b693dc','#f4eefc','#c3a6e6'];
const SAGE='#8ea68b';
const M=["Happy birthday, babygirl!","Sobrang proud ako sa’yo.","Sobrang ganda mo palagi.","Lagi lang akong nandito para sa’yo.","No matter what, love.","Your cheerful smile.","Always be the pretty, cheerful girl that you are.","I’ll support all your dreams.","Sana matupad lahat ng wishes mo.","Gagawin natin lahat ng gusto natin, together.","Suportado kita sa mga nagpapasaya sa’yo.","Be strong for yourself and for us.","You are so loved. Never forget that.","Enjoy every moment of today.","Mahal na mahal kita, Lavie.","Kaya natin ’to, love.","You make ordinary days brighter.","Happy happy birthday, hehe.","Isa ulit para sa birthday mo.","I love youuu so muchhh!"];
const LETTER=`Happiest birthday to my babygirl!! Hehehe.

Siguro isa ulit para sa birthday mo, hehe. Wala, gusto lang talaga kitang batiin ng happy happy birthday. Sana maging masaya ka sa birthday mo today and ma-enjoy mo every moment of it. But to make the story short, always remember na sobrang proud ako sa’yo, and sobrang ganda mo palagi. Lagi lang akong nandito para sa’yo, love, no matter what.

Kapos pa talaga tayo ngayon, pero kapag naging okay na ang lahat and nakaangat na tayo, gagawin natin lahat ng mga gusto nating gawin together. I hope matupad lahat ng wishes mo and lahat ng gusto mong ma-achieve. I’ll always support you sa mga gusto mo, sa mga pangarap mo, and sa mga bagay na nagpapasaya sa’yo.

Stay strong, love, and always be the pretty and cheerful girl that you are. Be strong for yourself and for us. I hope you never forget how much you are loved and how proud I am of you.

Mahal na mahal kita Lavie. Enjoy your day, loveee! I love youuu so muchhh!!`;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);

/* ---------- flowers ---------- */
function bloom(s,c,c2,n){let g='';
  for(let i=0;i<n;i++){const r=i*360/n;
    g+=`<ellipse cy="${-s*.55}" rx="${s*.3}" ry="${s*.55}" fill="${c}" stroke="#fff" stroke-opacity=".35" transform="rotate(${r})"/><line y1="${-s*.15}" y2="${-s*.95}" stroke="#fff" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round" transform="rotate(${r})"/>`}
  for(let i=0;i<n;i++)g+=`<ellipse cy="${-s*.3}" rx="${s*.2}" ry="${s*.34}" fill="${c2}" opacity=".92" transform="rotate(${(i+.5)*360/n})"/>`;
  return g+`<circle r="${s*.16}" fill="#f1e2b0"/><circle r="${s*.08}" fill="#d9b86a" opacity=".75"/>`}
function tulip(s,c,c2){return `<path d="M${-s*.5} 0C${-s*.55} ${-s*.9} ${-s*.2} ${-s*1.1} 0 ${-s*1.2}C${s*.2} ${-s*1.1} ${s*.55} ${-s*.9} ${s*.5} 0Q0 ${s*.25} ${-s*.5} 0Z" fill="${c}" stroke="#fff" stroke-opacity=".3"/><path d="M${-s*.28} ${-s*.1}C${-s*.3} ${-s*.8} ${-s*.1} ${-s*1.1} 0 ${-s*1.25}C${s*.1} ${-s*1.1} ${s*.3} ${-s*.8} ${s*.28} ${-s*.1}Z" fill="${c2}" opacity=".95"/><path d="M0 ${-s*.1}V${-s*1.1}" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>`}
function sprig(s,c){let g=`<line y1="${s*.9}" y2="${-s*.9}" stroke="${SAGE}" stroke-width="2.5" stroke-linecap="round"/>`;
  for(let k=0;k<7;k++){const y=-s*.9+k*s*.2;
    g+=`<ellipse cx="${-s*.1}" cy="${y}" rx="${s*.09}" ry="${s*.15}" fill="${c}" transform="rotate(-25 ${-s*.1} ${y})"/><ellipse cx="${s*.1}" cy="${y+s*.05}" rx="${s*.09}" ry="${s*.15}" fill="${c}" transform="rotate(25 ${s*.1} ${y})"/>`}
  return g+`<ellipse cy="${-s*.98}" rx="${s*.08}" ry="${s*.15}" fill="${c}"/>`}
// exactly 20 flowers: [x, y, type, size]
const F=[[300,115,'b',46],[215,165,'b',44],[385,165,'t',34],[140,235,'s',46],[460,235,'b',42],
[260,220,'t',32],[345,230,'b',48],[180,290,'b',46],[420,300,'t',34],[105,325,'b',38],
[500,325,'s',44],[300,305,'b',52],[235,350,'s',44],[370,355,'b',44],[150,390,'t',32],
[450,395,'b',40],[300,405,'t',36],[210,435,'b',36],[395,440,'s',42],[95,430,'b',34]];
const BB=[[60,380],[540,380],[250,150],[345,150],[70,285],[535,285],[190,365],[410,375],[300,255],[120,195],[485,190],[255,295]];
const BX=300,BY=620;
let out='<defs>'+P.map((p,i)=>`<linearGradient id="g${i}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${p}"/><stop offset="1" stop-color="${L[i]}"/></linearGradient>`).join('')+'</defs>';
[[120,480,-38],[490,480,38],[185,520,-22],[415,520,22],[255,540,-8],[345,540,8]].forEach(l=>{
  out+=`<ellipse cx="${l[0]}" cy="${l[1]}" rx="15" ry="64" fill="${SAGE}" opacity=".85" transform="rotate(${l[2]} ${l[0]} ${l[1]})"/>`});
BB.forEach((b,k)=>{const [x,y]=b;let d='';
  [[0,0],[-9,7],[8,9],[-3,-9],[13,-4]].forEach(o=>d+=`<circle cx="${x+o[0]}" cy="${y+o[1]}" r="3.4" fill="#fff" stroke="#d9c6f0" stroke-width=".8"/>`);
  out+=`<g class="f" style="animation-delay:${-k*.5}s"><path d="M${BX} ${BY}Q${x+(BX-x)*.3} ${(y+BY)/2} ${x} ${y}" stroke="${SAGE}" stroke-width="1.5" fill="none" opacity=".8"/>${d}</g>`});
F.map((f,i)=>({f,i})).sort((a,b)=>a.f[1]-b.f[1]).forEach(({f,i})=>{
  const [x,y,t,s]=f,k=i%7,c=`url(#g${k})`,c2=`url(#g${(i*3)%7})`;
  const by=t==='b'?y:t==='t'?y+s*.1:y+s*.9;
  const rot=t==='s'?(x-300)/10:t==='t'?(i%2?10:-10):(i*37)%60;
  const art=t==='b'?bloom(s,c,c2,i%3?7:6):t==='t'?tulip(s,c,c2):sprig(s,P[k]);
  out+=`<g class="g" style="--i:${i}"><g class="f" data-i="${i}" tabindex="0" role="button" aria-label="Flower ${i+1} of 20" style="animation-delay:${-(i*.7)}s"><path d="M${BX} ${BY}Q${x+(BX-x)*.3} ${(by+BY)/2} ${x} ${by}" fill="none" stroke="${SAGE}" stroke-width="3" stroke-linecap="round"/><g transform="translate(${x} ${y}) rotate(${rot})"><g class="head" style="--i:${i}">${art}</g></g></g></g>`});
out+=`<path d="M165 535Q300 575 435 535L338 745Q300 755 262 745Z" fill="var(--paper)" stroke="var(--paper2)" stroke-width="2"/>
<path d="M300 575L338 745Q300 755 262 745Z" fill="var(--paper2)" opacity=".75"/>
<path d="M205 600Q300 628 395 600L392 622Q300 650 208 622Z" fill="var(--ribbon)"/>
<path d="M300 625C255 595 232 660 262 668C282 672 292 645 300 625ZM300 625C345 595 368 660 338 668C318 672 308 645 300 625Z" fill="var(--ribbon)"/>
<path d="M300 628L278 706M300 628L322 706" stroke="var(--ribbon)" stroke-width="7" stroke-linecap="round"/><circle cx="300" cy="627" r="9" fill="var(--ribbon)"/>`;
const svg=$('b');svg.innerHTML=out;

/* ---------- ambient light ---------- */
const fx=document.createElement('div');fx.className='fx';let h='';
for(let i=0;i<28;i++)h+=`<span class="sp" style="left:${Math.random()*100}%;top:${Math.random()*100}%;--z:${3+Math.random()*7}px;--d:${2.5+Math.random()*3.5}s;--l:${-Math.random()*6}s"></span>`;
for(let i=0;i<14;i++)h+=`<span class="pt" style="left:${Math.random()*100}%;--z:${8+Math.random()*8}px;--c:${L[i%7]};--dx:${(Math.random()-.5)*160}px;--d:${16+Math.random()*12}s;--l:${-Math.random()*24}s"></span>`;
fx.innerHTML=h;document.body.appendChild(fx);

/* ---------- tap a flower ---------- */
const found=new Set();let tt;
function burst(x,y,n=9){if(RM)return;for(let i=0;i<n;i++){const p=document.createElement('span'),a=Math.random()*6.28,d=50+Math.random()*80;
  p.className='bp';p.style.cssText=`left:${x}px;top:${y}px;--c:${L[i%7]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px`;fx.appendChild(p);setTimeout(()=>p.remove(),1000)}}
function toast(t,sm){const e=$('toast');e.innerHTML=t+(sm?`<small>${sm}</small>`:'');e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),4200)}
function pick(f,x,y){const i=+f.dataset.i,hd=f.querySelector('.head');
  hd.classList.remove('pop');void hd.getBoundingClientRect();hd.classList.add('pop');
  found.add(i);burst(x,y);
  if(found.size===20){document.body.classList.add('all');$('cnt').textContent='You found all 20.';burst(innerWidth/2,innerHeight/2,40);toast('You found all 20 ♡','Happy birthday, Lavie!')}
  else{$('cnt').textContent=`Tap a flower. ${found.size} of 20 found.`;toast(M[i],`${found.size} of 20`)}}
svg.addEventListener('click',e=>{const f=e.target.closest('.f[data-i]');if(f)pick(f,e.clientX,e.clientY)});
svg.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const f=e.target.closest('.f[data-i]');if(!f)return;e.preventDefault();const r=f.getBoundingClientRect();pick(f,r.left+r.width/2,r.top+r.height/2)});

/* ---------- the letter ---------- */
const lt=$('lt'),pp=$('pp'),tx=$('tx');let ti=0,tm;
function type(){tx.textContent=LETTER.slice(0,++ti);pp.scrollTop=pp.scrollHeight;if(ti<LETTER.length)tm=setTimeout(type,24);else $('sk').hidden=true}
function openL(){lt.hidden=false;$('sk').hidden=false;ti=0;clearTimeout(tm);if(RM){tx.textContent=LETTER;$('sk').hidden=true}else type();$('cl').focus()}
function closeL(){clearTimeout(tm);lt.hidden=true;$('op').focus()}
$('op').onclick=openL;$('cl').onclick=closeL;
$('sk').onclick=()=>{clearTimeout(tm);ti=LETTER.length;tx.textContent=LETTER;$('sk').hidden=true;pp.scrollTop=0};
lt.addEventListener('click',e=>{if(e.target===lt)closeL()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!lt.hidden)closeL()});

/* ---------- music box (starts only when tapped) ---------- */
const SEQ=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],
[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,1],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2],[0,2]];
let ac,out2,playing=false,mt,si=0;
function note(f){const t=ac.currentTime;[[f,.5],[f*2,.16],[f*3,.05]].forEach(([fr,v])=>{const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+1.6);
  o.connect(g);g.connect(out2);o.start(t);o.stop(t+1.7)})}
function step(){if(!playing)return;const [f,b]=SEQ[si];if(f)note(f);si=(si+1)%SEQ.length;mt=setTimeout(step,b*580)}
$('mu').onclick=()=>{
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const m=ac.createGain();m.gain.value=.16;m.connect(ac.destination);
    const d=ac.createDelay(.5),fb=ac.createGain(),wet=ac.createGain();d.delayTime.value=.32;fb.gain.value=.35;wet.gain.value=.4;
    out2=ac.createGain();out2.connect(m);out2.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(m)}
  playing=!playing;$('mu').textContent=playing?'Pause music':'Play music';$('mu').setAttribute('aria-pressed',playing);
  if(playing){ac.resume();si=0;step()}else clearTimeout(mt)};
</script>
</body>
</html>
